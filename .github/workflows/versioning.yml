name: Versioning

# On a pull request: the advisory check.
# On a push to another branch: the preflight, the fallback for skipped hooks, then the push step (Delivery, Progress, Build, Attention).
# On a push to main: the preflight, then bypass detection, the finalize step, the stale-version check, the date sweep, the Watch flags and the Caution flags for field rules.
# Every day (06:17 UTC) and on request with mode "daily": the preflight, the Implemented tickets, the date sweep and the flags.
#   The daily run never commits to a branch.
# On request with mode "finalize": the preflight and the finalize step, as a dry run unless told otherwise (safe to repeat).
# On request with mode "release", "hotfix" or "retire": the preflight and that step, as a dry run unless told otherwise.
#   A hotfix is finished from its own branch (start the workflow from that branch).

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - '**'
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'What to run (release, hotfix and retire need the inputs below)'
        type: choice
        options:
          - finalize
          - daily
          - release
          - hotfix
          - retire
        default: finalize
      dry_run:
        description: 'Only report what the steps would do'
        type: boolean
        default: true
      version:
        description: 'release: the finalized version (empty for the latest); hotfix: the hotfix version, for example V1.25.0-HF1'
        type: string
        required: false
      branch:
        description: 'retire: the branch to retire (a hotfix is finished from the hotfix branch itself: run from it)'
        type: string
        required: false
      outcome:
        description: 'retire: what became of the branch'
        type: choice
        options:
          - archived
          - suspended
          - abandoned
        default: archived
      confirm:
        description: 'retire: the branch name typed again'
        type: string
        required: false
      comment:
        description: 'retire: an optional short comment for the tag, in kebab-case'
        type: string
        required: false

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  advisory:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the pull request
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Advisory check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PULL_REQUEST: ${{ github.event.pull_request.number }}
        run: |
          git fetch origin main
          python3 .github/scripts/advisory.py

  branch:
    if: github.event_name == 'push' && github.ref != 'refs/heads/main' && !github.event.deleted
    runs-on: ubuntu-latest
    concurrency:
      group: versioning-branch-${{ github.ref }}
      cancel-in-progress: false
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
    steps:
      - name: Checkout the branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set the commit author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Preflight
        run: python3 .github/scripts/preflight.py

      - name: Fill in a build heading left by skipped hooks
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
        run: python3 .github/scripts/skipped_hooks.py

      - name: Push step
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: AFTER_SHA=$(git rev-parse HEAD) python3 .github/scripts/push_step.py

  main:
    # The automation's own commits start with "Finalize" or "Flag bypass"; skipping them avoids a loop.
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.mode == 'finalize') ||
      (github.event_name == 'push' &&
       github.ref == 'refs/heads/main' &&
       !startsWith(github.event.head_commit.message, 'Finalize ') &&
       !startsWith(github.event.head_commit.message, 'Flag bypass'))
    runs-on: ubuntu-latest
    concurrency:
      group: versioning-main
      cancel-in-progress: false
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          # The project token belongs to an administrator, so the automation's commits can go to main.
          token: ${{ secrets.PROJECT_TOKEN || github.token }}

      - name: Set the commit author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Preflight
        run: python3 .github/scripts/preflight.py

      - name: Detect a bypass
        if: github.event_name == 'push'
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
          PUSHER: ${{ github.actor }}
        run: python3 .github/scripts/bypass.py

      - name: Finalize the version
        env:
          GITHUB_SHA: ${{ github.sha }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            python3 .github/scripts/finalize.py --dry-run
          else
            python3 .github/scripts/finalize.py
          fi

      - name: Check for stale planned versions
        if: github.event_name == 'push' || inputs.dry_run == false
        run: python3 .github/scripts/bypass.py stale

      - name: Sweep the dates
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            python3 .github/scripts/dates.py --dry-run
          else
            python3 .github/scripts/dates.py
          fi

      - name: Flag stale tickets
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            python3 .github/scripts/watch.py --dry-run
          else
            python3 .github/scripts/watch.py
          fi

      - name: Flag broken field rules
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            python3 .github/scripts/field_rules.py --dry-run
          else
            python3 .github/scripts/field_rules.py
          fi

  daily:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'daily')
    runs-on: ubuntu-latest
    concurrency:
      group: versioning-daily
      cancel-in-progress: false
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preflight
        run: python3 .github/scripts/preflight.py

      - name: Attach Implemented tickets to their versions
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            python3 .github/scripts/implemented.py --dry-run
          else
            python3 .github/scripts/implemented.py
          fi

      - name: Sweep the dates
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            python3 .github/scripts/dates.py --dry-run
          else
            python3 .github/scripts/dates.py
          fi

      - name: Flag stale tickets
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            python3 .github/scripts/watch.py --dry-run
          else
            python3 .github/scripts/watch.py
          fi

      - name: Flag broken field rules
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            python3 .github/scripts/field_rules.py --dry-run
          else
            python3 .github/scripts/field_rules.py
          fi

  release:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'release'
    runs-on: ubuntu-latest
    concurrency:
      group: versioning-release
      cancel-in-progress: false
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
      DRY_RUN: ${{ inputs.dry_run }}
      VERSION: ${{ inputs.version }}
    steps:
      - name: Checkout the ref the run was started from
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preflight
        run: python3 .github/scripts/preflight.py

      - name: Release the version
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            python3 .github/scripts/release.py --dry-run
          else
            python3 .github/scripts/release.py
          fi

  hotfix:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'hotfix' && github.ref_type == 'branch'
    runs-on: ubuntu-latest
    concurrency:
      group: versioning-hotfix-${{ github.ref_name }}
      cancel-in-progress: false
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
      DRY_RUN: ${{ inputs.dry_run }}
      VERSION: ${{ inputs.version }}
      BRANCH: ${{ github.ref_name }}
    steps:
      - name: Checkout the hotfix branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          fetch-tags: true

      - name: Set the commit author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Preflight
        run: python3 .github/scripts/preflight.py

      - name: Finish the hotfix
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            python3 .github/scripts/hotfix.py --dry-run
          else
            python3 .github/scripts/hotfix.py
          fi

  retire:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'retire'
    runs-on: ubuntu-latest
    concurrency:
      group: versioning-retire
      cancel-in-progress: false
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
      DRY_RUN: ${{ inputs.dry_run }}
      BRANCH: ${{ inputs.branch }}
      OUTCOME: ${{ inputs.outcome }}
      CONFIRM: ${{ inputs.confirm }}
      COMMENT: ${{ inputs.comment }}
    steps:
      - name: Checkout the ref the run was started from
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preflight
        run: python3 .github/scripts/preflight.py

      - name: Retire the branch
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            python3 .github/scripts/retire.py --dry-run
          else
            python3 .github/scripts/retire.py
          fi
